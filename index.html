<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14282c" />
    <title>幻境編年史</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">幻境編年史</h1>
      <nav class="tabs" aria-label="主選單">
        <a class="tab" href="#map" data-view-link="map">世界地圖</a>
        <a class="tab" href="#rest" data-view-link="rest">修整日</a>
        <a class="tab" href="#bag" data-view-link="bag">背包</a>
      </nav>
      <button id="index-toggle" class="btn btn--ghost" type="button" aria-expanded="false" aria-controls="index-panel">
        地點索引
      </button>
    </header>

    <main class="atlas view" id="view-map" data-view="map">
      <div id="map-viewport" class="map-viewport" data-zoomed="false">
        <div id="map-stage" class="map-stage">
          <img id="map-image" class="map-image" src="/img/maps/world.webp" alt="幻境編年史世界全圖" draggable="false" />
          <div id="map-hotspots" class="map-hotspots"></div>
        </div>
      </div>

      <div class="zoom-controls" role="group" aria-label="地圖縮放">
        <button id="zoom-in" class="zoom-btn" type="button" aria-label="放大">＋</button>
        <button id="zoom-out" class="zoom-btn" type="button" aria-label="縮小">－</button>
        <button id="zoom-reset" class="zoom-btn zoom-btn--text" type="button">全圖</button>
      </div>

      <p class="map-hint">點地名查看情報，拖曳移動，滾輪或雙指縮放</p>

      <aside id="marker-card" class="marker-card" data-open="false" aria-hidden="true" aria-label="地點小卡片"></aside>

      <aside id="index-panel" class="index-panel" data-open="false" aria-label="地點索引">
        <div id="index-list" class="index-list"></div>
      </aside>

      <aside id="dossier" class="dossier" data-open="false" data-theme="sea" aria-hidden="true" aria-label="地點情報">
        <button class="dossier__close" type="button" data-dossier-close>關閉</button>
        <div class="dossier__body" data-dossier-body></div>
      </aside>
    </main>

    <main class="view view--page" id="view-rest" data-view="rest" hidden></main>
    <main class="view view--page" id="view-bag" data-view="bag" hidden></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
