<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15120E" />
    <!-- PWA：手機「加到主畫面」（見 public/manifest.webmanifest、public/sw.js、tools/make-icons.py） -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="幻境編年史" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>幻境編年史</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字型非同步載入：不擋住第一次畫面（先用系統字，載好再換），手機網路慢時不會整頁白屏 -->
    <link
      rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap" /></noscript>
  </head>
  <body>
    <!-- 封面骨架直接寫在 HTML：網頁一開就先看到封面，不會在 JS 載入前閃出後面的地圖。按鈕與登入狀態由 src/ui/cover.js 補上 -->
    <div class="cover" id="cover">
      <div class="cover__fx" aria-hidden="true"></div>
      <div class="cover__inner">
        <p class="cover__kicker">網遊 · 跑團 · 編年史</p>
        <h1 id="cover-title" class="cover__title">幻境編年史</h1>
        <p class="cover__lead">踏入幻境，書寫屬於你的篇章。</p>
        <div class="cover__load" aria-hidden="true"><span class="cover__load-text">幻境載入中…</span><span class="cover__load-bar"></span></div>
      </div>
    </div>
    <header class="topbar">
      <h1 class="brand">幻境編年史</h1>
      <nav class="tabs" aria-label="主選單">
        <a class="tab" href="#map" data-view-link="map">世界地圖</a>
        <a class="tab" href="#rest" data-view-link="rest">修整日</a>
        <a class="tab" href="#bag" data-view-link="bag">背包</a>
        <a class="tab" href="#gear" data-view-link="gear">裝備</a>
        <a class="tab" href="#session" data-view-link="session">跑團</a>
        <a class="tab" href="#market" data-view-link="market">交易</a>
        <a class="tab" href="#logs" data-view-link="logs">日誌</a>
        <!-- 手機底部導覽列的「更多」：裝備、交易收在這裡（電腦版不顯示） -->
        <button id="more-toggle" class="tab tab--more" type="button" aria-expanded="false" aria-controls="more-menu">更多</button>
      </nav>
      <div id="more-menu" class="more-menu" hidden>
        <a class="more-menu__item" href="#gear" data-view-link="gear">裝備</a>
        <a class="more-menu__item" href="#market" data-view-link="market">交易</a>
        <a class="more-menu__item" href="#logs" data-view-link="logs">日誌</a>
      </div>
    </header>

    <main class="atlas view" id="view-map" data-view="map">
      <div id="map-viewport" class="map-viewport" data-zoomed="false">
        <div id="map-stage" class="map-stage">
          <img id="map-image" class="map-image" src="img/maps/world.webp" alt="幻境編年史世界全圖" draggable="false" fetchpriority="high" decoding="async" />
          <div id="map-hotspots" class="map-hotspots"></div>
        </div>
      </div>


      <p class="map-hint">點地名查看情報・拖曳移動・雙指或滾輪縮放・點兩下放大</p>



      <aside id="dossier" class="dossier" data-open="false" data-theme="sea" aria-hidden="true" aria-label="地點情報">
        <button class="dossier__close" type="button" data-dossier-close>關閉</button>
        <div class="dossier__body" data-dossier-body></div>
      </aside>
    </main>

    <main class="view view--page" id="view-rest" data-view="rest" hidden></main>
    <main class="view view--page" id="view-bag" data-view="bag" hidden></main>
    <main class="view view--page" id="view-gear" data-view="gear" hidden></main>
    <main class="view view--page" id="view-session" data-view="session" hidden></main>
    <main class="view view--page" id="view-market" data-view="market" hidden></main>
    <main class="view view--page" id="view-logs" data-view="logs" hidden></main>
    <main class="view view--page" id="view-wait" hidden></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
